name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Build and test
        run: npm test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
